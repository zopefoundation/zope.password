[buildout]
develop = .
parts = zpasswd test coverage-test

[test]
recipe = zc.recipe.testrunner
eggs = zope.password [test]

[coverage-test]
recipe = zc.recipe.testrunner
eggs = zope.password [test]
defaults = ['--coverage', '../../coverage']

[zpasswd]
recipe = zc.recipe.egg
eggs = zope.password
scripts = zpasswd
